; Test matrix mirroring the support range of python-couchbase-helper.
;
; Local use (uv fetches the interpreters):
;     uv tool install tox --with tox-uv
;     tox -e py314-cblatest        # fastest single check
;     tox -p auto                  # the whole matrix, in parallel
;
;   cblatest - newest SDK each interpreter permits (4.6.x from 3.10 on, where
;              the private internals we subclass were rewritten).
;   cbmin    - the oldest SDK supported on that interpreter. 4.1.9 is the oldest
;              usable release: earlier wheels link libssl.so.1.1, which current
;              distros no longer ship.
;
; The timezone regression tests set TZ themselves via time.tzset(), so they are
; meaningful even on UTC CI runners.

[tox]
envlist =
    py{39,310,311,312,313,314}-cblatest
    py{39,310,311,312,313,314}-cbmin
isolated_build = true
skip_missing_interpreters = false

[testenv]
passenv = TZ
deps =
    pytest
    py39-cblatest: couchbase<4.6
    py{310,311,312,313,314}-cblatest: couchbase<4.7
    py{39,310,311}-cbmin: couchbase==4.1.9
    py312-cbmin: couchbase==4.3.2
    py313-cbmin: couchbase==4.3.4
    py314-cbmin: couchbase==4.6.0
commands =
    python -c 'import sys; from fake_couchbase._compat import SDK_VERSION; print("python", sys.version.split()[0], "/ couchbase", ".".join(map(str, SDK_VERSION)))'
    pytest {posargs}
